{% load static %}

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Admin Panel - NoteCircle</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="header">
            <div class="title">NoteCirle</div>
            <form action="/admin/logout/" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>

        <main id="main-content" hx-get="{% url 'custom_admin' %}" hx-trigger="every 1s" hx-select="#main-content" hx-swap="outerHTML">
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="users-grid">
                {% for user in users %}
                    {% include 'user_card.html' %}
                {% endfor %}
            </div>
        </main>


        <div class="footer">
            <div class="footer-left">Plat Ilich</div>
            <div class="footer-right">
                <a href="https://github.com/platilich" target="_blank">GitHub</a>
            </div>
        </div>

        <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    </body>
</html>
